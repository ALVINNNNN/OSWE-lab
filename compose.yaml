name: oswe-lab
x-target: &target
  build: .
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  pids_limit: 64
  mem_limit: 256m
  cpus: 0.5
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 5s
    timeout: 4s
    retries: 10
    start_period: 10s
services:
  recovery:
    <<: *target
    environment:
      LAB_ID: recovery
      PATCHED: "${PATCHED:-0}"
    ports: ["127.0.0.1:8101:8000"]
    networks: [recovery]
  reports:
    <<: *target
    environment:
      LAB_ID: reports
      PATCHED: "${PATCHED:-0}"
    ports: ["127.0.0.1:8102:8000"]
    networks: [reports]
  studio:
    <<: *target
    environment:
      LAB_ID: studio
      PATCHED: "${PATCHED:-0}"
    ports: ["127.0.0.1:8103:8000"]
    networks: [studio]
networks:
  recovery:
    internal: true
  reports:
    internal: true
  studio:
    internal: true
